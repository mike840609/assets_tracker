name: Publish GitHub Releases

on:
  push:
    branches: [master]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semver tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: github-releases
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}

jobs:
  publish-tag:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ -n "$DISPATCH_TAG" ]]; then
            tag="$DISPATCH_TAG"
          else
            tag="$REF_NAME"
          fi

          if [[ ! "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag: $tag" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; nothing to do."
            exit 0
          fi

          gh release create "$TAG" \
            --verify-tag \
            --title "astt $VERSION" \
            --generate-notes

  reconcile-missing:
    name: Reconcile missing releases
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Publish releases for semver tags that are missing one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t tags < <(
            gh api --paginate "repos/$GH_REPO/tags?per_page=100" \
              --jq '.[].name' \
              | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V
          )

          for tag in "${tags[@]}"; do
            if gh release view "$tag" >/dev/null 2>&1; then
              continue
            fi

            version="${tag#v}"
            echo "Publishing missing GitHub Release $tag"
            gh release create "$tag" \
              --verify-tag \
              --title "astt $version" \
              --generate-notes
          done
