name: Vercel Preview E2E

on:
  deployment_status:

permissions:
  contents: read
  pull-requests: read

jobs:
  authorize:
    name: Authorize preview commit
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment != 'Production'
    runs-on: ubuntu-latest
    outputs:
      trusted: ${{ steps.trust.outputs.trusted }}
      url: ${{ steps.trust.outputs.url }}
      pr: ${{ steps.trust.outputs.pr }}
    steps:
      - name: Allow only trusted same-repository pull requests
        id: trust
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const deployment = context.payload.deployment;
            const deploymentStatus = context.payload.deployment_status;
            const pullRequests = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              { owner, repo, commit_sha: deployment.sha },
            );
            const trustedAssociations = new Set(["OWNER", "MEMBER", "COLLABORATOR"]);
            const isEligible = (pullRequest) =>
              pullRequest.state === "open" &&
              pullRequest.head.sha === deployment.sha &&
              pullRequest.head.repo?.full_name === `${owner}/${repo}` &&
              trustedAssociations.has(pullRequest.author_association);
            // A commit is associated with every pull request stacked on top of
            // it, in an order the API does not document. Only exact-head matches
            // are candidates, and each is refreshed before authorization so a
            // late deployment event cannot fall back to a stacked or advanced PR.
            const candidateNumbers = [
              ...new Set(
                pullRequests
                  .filter((pullRequest) => pullRequest.head.sha === deployment.sha)
                  .map((pullRequest) => pullRequest.number),
              ),
            ];
            const refreshedPullRequests = await Promise.all(
              candidateNumbers.map(async (pull_number) => {
                try {
                  const response = await github.rest.pulls.get({ owner, repo, pull_number });
                  return response.data;
                } catch (error) {
                  // This is the security gate, so an unverifiable candidate is
                  // dropped rather than trusted on the list endpoint's snapshot.
                  core.warning(`Could not refresh pull request #${pull_number}: ${error.message}`);
                  return undefined;
                }
              }),
            );
            const eligiblePullRequests = refreshedPullRequests
              .filter((pullRequest) => pullRequest !== undefined)
              .filter(isEligible)
              .sort((a, b) => a.number - b.number);
            // Several open pull requests can share one head commit: a branch
            // opened against two bases, a duplicate, a reopened one. All of them
            // are same-repository, trusted and at the deployed commit by now, so
            // pick deterministically rather than dropping the check entirely --
            // the number only keys concurrency and the later re-reads.
            const trustedPullRequest = eligiblePullRequests[0];
            const fromVercel =
              deployment.creator?.login === "vercel[bot]" &&
              deploymentStatus.creator?.login === "vercel[bot]";
            let previewUrl;
            try {
              previewUrl = new URL(deploymentStatus.environment_url);
            } catch {
              core.warning("Skipping preview E2E because the deployment URL is invalid.");
            }
            const trustedUrl =
              previewUrl instanceof URL &&
              previewUrl.protocol === "https:" &&
              previewUrl.hostname.endsWith(".vercel.app") &&
              previewUrl.port === "" &&
              previewUrl.username === "" &&
              previewUrl.password === "";
            // Redeploying one commit produces a second event that the head-SHA
            // test cannot call stale, and cancellation is deliberately off, so
            // only the newest deployment of a commit runs the suite. A duplicate
            // created after this read still gets its own run; that costs a
            // repeat suite, never a cancelled one.
            let superseded = false;
            try {
              const deployments = await github.paginate(github.rest.repos.listDeployments, {
                owner,
                repo,
                sha: deployment.sha,
              });
              superseded = deployments.some(
                (candidate) =>
                  candidate.id > deployment.id && candidate.environment !== "Production",
              );
            } catch (error) {
              core.warning(`Could not list deployments for ${deployment.sha}: ${error.message}`);
            }
            const trusted =
              Boolean(trustedPullRequest) && fromVercel && trustedUrl && !superseded;
            core.notice(
              trusted
                ? `Running preview E2E against ${previewUrl.origin}.`
                : superseded
                  ? "Skipping preview E2E because a newer deployment exists for this commit."
                  : "Skipping preview E2E because the commit, deployment source, or URL is not trusted.",
            );
            core.setOutput("trusted", String(trusted));
            core.setOutput("url", trusted ? previewUrl.origin : "");
            // Grouping key for the e2e job: runs for one pull request serialize,
            // while separate pull requests remain independent. deployment.ref is
            // the SHA here, so it cannot serve.
            core.setOutput("pr", trusted ? String(trustedPullRequest.number) : "");

  e2e:
    name: Playwright preview smoke tests
    needs: authorize
    if: needs.authorize.outputs.trusted == 'true'
    concurrency:
      group: vercel-preview-e2e-pr-${{ needs.authorize.outputs.pr }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check preview freshness before setup
        id: freshness
        uses: actions/github-script@v8
        env:
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
          PR_NUMBER: ${{ needs.authorize.outputs.pr }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const deploymentSha = process.env.DEPLOYMENT_SHA;
            const pull_number = Number(process.env.PR_NUMBER);
            let pullRequest;
            try {
              const response = await github.rest.pulls.get({ owner, repo, pull_number });
              pullRequest = response.data;
            } catch (error) {
              // Authorization already established trust, so an unreadable pull
              // request costs at most one suite against a superseded preview.
              // Failing closed here would turn a GitHub outage into a red check.
              core.warning(`Could not re-read pull request #${pull_number}: ${error.message}`);
            }
            const fresh =
              !pullRequest ||
              (pullRequest.state === "open" &&
                pullRequest.head.sha === deploymentSha &&
                pullRequest.head.repo?.full_name === `${owner}/${repo}`);
            core.setOutput("fresh", String(fresh));
            core.notice(
              fresh
                ? "Preview commit is still current; continuing setup."
                : "Skipping preview E2E because the pull request is no longer open at the deployed commit.",
            );

      - uses: actions/checkout@v5
        if: steps.freshness.outputs.fresh == 'true'
        with:
          ref: ${{ github.event.deployment.sha }}

      - uses: pnpm/action-setup@v4
        if: steps.freshness.outputs.fresh == 'true'

      - name: Set up Node.js
        if: steps.freshness.outputs.fresh == 'true'
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        if: steps.freshness.outputs.fresh == 'true'
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        if: steps.freshness.outputs.fresh == 'true'
        id: playwright
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        if: steps.freshness.outputs.fresh == 'true'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browser (cache miss)
        if: >-
          steps.freshness.outputs.fresh == 'true' &&
          steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies (cache hit)
        if: >-
          steps.freshness.outputs.fresh == 'true' &&
          steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Revalidate preview commit
        id: final-freshness
        if: steps.freshness.outputs.fresh == 'true'
        uses: actions/github-script@v8
        env:
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
          PR_NUMBER: ${{ needs.authorize.outputs.pr }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const deploymentSha = process.env.DEPLOYMENT_SHA;
            const pull_number = Number(process.env.PR_NUMBER);
            let pullRequest;
            try {
              const response = await github.rest.pulls.get({ owner, repo, pull_number });
              pullRequest = response.data;
            } catch (error) {
              // Same trade as the pre-setup gate, and more valuable here: this
              // read happens after checkout, install and browser setup are paid.
              core.warning(`Could not re-read pull request #${pull_number}: ${error.message}`);
            }
            const fresh =
              !pullRequest ||
              (pullRequest.state === "open" &&
                pullRequest.head.sha === deploymentSha &&
                pullRequest.head.repo?.full_name === `${owner}/${repo}`);
            core.setOutput("fresh", String(fresh));
            core.notice(
              fresh
                ? "Preview commit is still current; running deployment checks."
                : "Skipping preview E2E because the pull request is no longer open at the deployed commit.",
            );

      - name: Run deployment check
        if: >-
          steps.freshness.outputs.fresh == 'true' &&
          steps.final-freshness.outputs.fresh == 'true'
        # Preview verifies the deployment itself: sign-in, landing, dashboard, and
        # the create-account -> add-holding write path (smoke.spec.ts), plus the
        # social preview, whose VERCEL_URL branch localhost cannot reach.
        # Full Desktop + Mobile regression stays in e2e.yml on localhost.
        run: >-
          pnpm playwright test --project=chromium
          tests/e2e/smoke.spec.ts
          tests/e2e/landing-social-preview.spec.ts
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ needs.authorize.outputs.url }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        # always() first: it reads as the override it is, and a status function
        # anywhere in the expression already suppresses the implicit success().
        # Gate on the final check rather than the first one, so a run that
        # stopped between them does not look for a report that was never made.
        if: always() && steps.final-freshness.outputs.fresh == 'true'
        with:
          name: vercel-preview-playwright-report
          path: playwright-report/
          retention-days: 30
